<section class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <span class="auth-eyebrow">Nexa Platform</span>

      <h1>Recuperar contraseña</h1>

      <p>
        Te enviaremos instrucciones si el correo está registrado.
      </p>
    </div>

    @if (isSent()) {
      <p class="auth-success">
        Si el correo está registrado, enviaremos instrucciones para restablecer la contraseña.
      </p>
    } @else {
      <form
        class="auth-form"
        (ngSubmit)="onSubmit()"
      >
        <div class="auth-field">
          <label for="email">
            Correo electrónico
          </label>

          <input
            id="email"
            name="email"
            type="email"
            [(ngModel)]="email"
            placeholder="nombre@empresa.cl"
            autocomplete="email"
            required
          />
        </div>

        @if (errorMessage()) {
          <p class="auth-error">
            {{ errorMessage() }}
          </p>
        }

        <button
          type="submit"
          class="auth-submit"
          [disabled]="isLoading()"
        >
          {{ isLoading() ? 'Enviando...' : 'Enviar instrucciones' }}
        </button>
      </form>
    }

    <div class="auth-footer">
      <a routerLink="/login">
        Volver a iniciar sesión
      </a>
    </div>

  </div>
</section>
