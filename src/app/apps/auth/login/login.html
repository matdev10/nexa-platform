<section class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <span class="auth-eyebrow">Nexa Platform</span>

      <h1>Iniciar sesión</h1>

      <p>
        Accede a tu organización y continúa trabajando en Nexa.
      </p>
    </div>

    <form
      class="auth-form"
      (ngSubmit)="onSubmit()"
    >

      <div class="auth-field">
        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="nombre@empresa.cl"
          autocomplete="email"
          required
        />
      </div>

      <div class="auth-field">
        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          placeholder="Ingresa tu contraseña"
          autocomplete="current-password"
          required
        />
      </div>

      @if (errorMessage()) {
        <p class="auth-error">
          {{ errorMessage() }}
        </p>
      }

      <button
        type="submit"
        class="auth-submit"
        [disabled]="isLoading()"
      >
        {{ isLoading() ? 'Ingresando...' : 'Iniciar sesión' }}
      </button>

    </form>

    <div class="auth-footer">
      <a routerLink="/forgot-password">
        ¿Olvidaste tu contraseña?
      </a>

      <a routerLink="/register">
        Crear cuenta
      </a>
    </div>

  </div>
</section>
