<section class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <span class="auth-eyebrow">Nexa Platform</span>

      <h1>Nueva contraseña</h1>

      <p>
        Elige una contraseña para volver a entrar a Nexa.
      </p>
    </div>

    @if (isUpdated()) {
      <p class="auth-success">
        Tu contraseña fue actualizada. Ya puedes iniciar sesión.
      </p>
    } @else {
      <form
        class="auth-form"
        (ngSubmit)="onSubmit()"
      >
        <div class="auth-field">
          <label for="password">
            Nueva contraseña
          </label>

          <input
            id="password"
            name="password"
            type="password"
            [(ngModel)]="password"
            autocomplete="new-password"
            required
          />
        </div>

        <div class="auth-field">
          <label for="confirmPassword">
            Confirmar contraseña
          </label>

          <input
            id="confirmPassword"
            name="confirmPassword"
            type="password"
            [(ngModel)]="confirmPassword"
            autocomplete="new-password"
            required
          />
        </div>

        @if (errorMessage()) {
          <p class="auth-error">
            {{ errorMessage() }}
          </p>
        }

        <button
          type="submit"
          class="auth-submit"
          [disabled]="isLoading() || !token"
        >
          {{ isLoading() ? 'Guardando...' : 'Guardar contraseña' }}
        </button>
      </form>
    }

    <div class="auth-footer">
      <a routerLink="/login">
        Iniciar sesión
      </a>
    </div>

  </div>
</section>
