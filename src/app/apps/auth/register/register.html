<section class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <span class="auth-eyebrow">Nexa Platform</span>

      <h1>Crear cuenta</h1>

      <p>
        Crea tu acceso para comenzar a configurar tu organización.
      </p>
    </div>

    <form
      class="auth-form"
      (ngSubmit)="onSubmit()"
    >

      <div class="auth-field">
        <label for="firstName">
          Nombre
        </label>

        <input
          id="firstName"
          name="firstName"
          type="text"
          [(ngModel)]="firstName"
          autocomplete="given-name"
          required
        />
      </div>

      <div class="auth-field">
        <label for="lastName">
          Apellido
        </label>

        <input
          id="lastName"
          name="lastName"
          type="text"
          [(ngModel)]="lastName"
          autocomplete="family-name"
          required
        />
      </div>

      <div class="auth-field">
        <label for="email">
          Correo electrónico
        </label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          autocomplete="email"
          required
        />
      </div>

      <div class="auth-field">
        <label for="password">
          Contraseña
        </label>

        <input
          id="password"
          name="password"
          type="password"
          [(ngModel)]="password"
          autocomplete="new-password"
          required
        />
      </div>

      <div class="auth-field">
        <label for="confirmPassword">
          Confirmar contraseña
        </label>

        <input
          id="confirmPassword"
          name="confirmPassword"
          type="password"
          [(ngModel)]="confirmPassword"
          autocomplete="new-password"
          required
        />
      </div>

      @if (errorMessage()) {
        <p class="auth-error">
          {{ errorMessage() }}
        </p>
      }

      <button
        type="submit"
        class="auth-submit"
        [disabled]="isLoading()"
      >
        {{ isLoading() ? 'Creando cuenta...' : 'Crear cuenta' }}
      </button>

    </form>

    <div class="auth-footer">
      <span>¿Ya tienes una cuenta?</span>

      <a routerLink="/login">
        Iniciar sesión
      </a>
    </div>

  </div>
</section>
