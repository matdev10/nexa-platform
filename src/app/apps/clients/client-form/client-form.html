<section class="nexa-page">
  <a class="nexa-back" routerLink="/clients">Volver a clientes</a>

  <header class="nexa-page__header">
    <div>
      <span class="nexa-page__eyebrow">CRM</span>

      <h1>{{ isEditing ? 'Editar cliente' : 'Crear cliente' }}</h1>

      <p>El cliente queda asociado al Workspace activo.</p>
    </div>
  </header>

  @if (isLoading()) {
    <p class="nexa-status">Cargando cliente...</p>
  } @else {
    <form class="nexa-card nexa-form" (ngSubmit)="onSubmit()">
      <div class="nexa-field">
        <label for="name">Nombre</label>

        <input
          id="name"
          name="name"
          type="text"
          [(ngModel)]="name"
          required
          placeholder="Ej: Ana Pérez"
        />
      </div>

      <div class="nexa-field">
        <label for="company">Empresa</label>

        <input
          id="company"
          name="company"
          type="text"
          [(ngModel)]="company"
          placeholder="Ej: Pérez y Cía. Ltda."
        />
      </div>

      <div class="nexa-field">
        <label for="email">Correo</label>

        <input
          id="email"
          name="email"
          type="email"
          [(ngModel)]="email"
          placeholder="ana@empresa.cl"
        />
      </div>

      <div class="nexa-field">
        <label for="phone">Teléfono</label>

        <input
          id="phone"
          name="phone"
          type="tel"
          [(ngModel)]="phone"
          placeholder="+56 9 1234 5678"
        />
      </div>

      @if (isEditing) {
        <div class="nexa-field">
          <label for="status">Estado</label>

          <select id="status" name="status" [(ngModel)]="status">
            <option value="active">Activo</option>
            <option value="inactive">Inactivo</option>
          </select>
        </div>
      }

      @if (errorMessage()) {
        <p class="nexa-error">{{ errorMessage() }}</p>
      }

      <div class="nexa-actions">
        <button type="submit" class="nexa-button" [disabled]="isSaving()">
          {{ isSaving() ? 'Guardando...' : isEditing ? 'Guardar cambios' : 'Crear cliente' }}
        </button>
      </div>
    </form>
  }
</section>
