<section class="auth-page">
  <div class="auth-card">

    <div class="auth-header">
      <span class="auth-eyebrow">Nexa Platform</span>

      <h1>Configura Nexa</h1>

      <p>
        Crea tu primera organización y después configura su primer Workspace.
      </p>
    </div>

    <form class="auth-form">
      <button
        type="button"
        class="auth-submit"
        (click)="start()"
      >
        Comenzar configuración
      </button>
    </form>

  </div>
</section>
